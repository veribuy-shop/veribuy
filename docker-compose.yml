services:
  postgres:
    image: postgres:17-alpine
    container_name: veribuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veribuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veribuy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-veribuy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veribuy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.4-alpine
    container_name: veribuy-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-veribuy_redis_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-veribuy_redis_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veribuy-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-veribuy}:${POSTGRES_PASSWORD:-veribuy_dev_password}@postgres:5432/${POSTGRES_DB:-veribuy}
      BACKEND_URL: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: veribuy-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3010:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: veribuy_postgres_data
  redis_data:
    name: veribuy_redis_data
